<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Placar de vitórias para dois jogadores: Pife, Uno e outros jogos, com estatísticas, filtro por período, comemoração e cartão para compartilhar. Visual de giz de cera pastel.">
<meta name="theme-color" content="#A9DFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C2A40" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Placar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root { padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Placar Pife e Uno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: cena de colinas e nuvens no topo, seletor de jogos, abas Placar / Estatísticas / Histórico, filtro de período.
     Estilo: papel cru com giz de cera pastel, contornos marrons grossos de traço irregular, ovos manchados no lugar do número.
     Movimento: sempre em poucos quadros (steps), como animação feita a giz de cera. */
  --bg: #CFEEF7; --dot: rgba(255,255,255,.75);
  --surface: #FFF8DC; --surface2: #F4EAC0; --fg: #4A3220; --muted: #6F573D; --line: #DCCB9E;
  --a: #8FD14F; --a-soft: #DDF3BE; --a-ink: #3F7A1E;
  --b: #FF9DB5; --b-soft: #FFDDE6; --b-ink: #C23A5E;
  --sun: #FFE066; --egg: #FFFDF0; --on-pc: #3A2814; --danger: #B42318; --shadow: rgba(74,50,32,.28);
  --c-red: #FF8F8F; --c-yellow: #FFE066; --c-green: #8FD14F; --c-blue: #6EB6F2;
  --title-fill: #FFFDF0; --title-edge: #4A3220;
  --hill: #8FD14F; --hill2: #B7E37A; --cloud: #FFFFFF; --scene-sky: #A9DFF2;
  --wob: 16px 20px 14px 22px / 20px 14px 22px 16px;
  --font-display: 'Chewy', 'Comic Sans MS', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Fredoka', 'Trebuchet MS', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-sym: system-ui, 'Segoe UI Symbol', 'Apple Symbols', 'Noto Sans Symbols 2', sans-serif;
}
:root[data-game="uno"], :root[data-pal="2"] {
  --a: #6EB6F2; --a-soft: #D6EAFB; --a-ink: #1F5FA8;
  --b: #FF8F8F; --b-soft: #FFDAD6; --b-ink: #C23A3A;
}
:root[data-pal="3"] {
  --a: #FFB35C; --a-soft: #FFE5C2; --a-ink: #A8560A;
  --b: #B79CFF; --b-soft: #E8DEFF; --b-ink: #6B45C9;
}
:root[data-pal="4"] {
  --a: #5FD6C9; --a-soft: #CDF4EF; --a-ink: #12766C;
  --b: #FFE066; --b-soft: #FFF3BF; --b-ink: #8A6A00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C2A40; --dot: rgba(255,255,255,.07);
    --surface: #2B3C57; --surface2: #364C6E; --fg: #F6EBCB; --muted: #BAC6D9; --line: #4A6286;
    --a: #9AD95A; --a-soft: #2D4A2B; --a-ink: #A8E070;
    --b: #FF9DB5; --b-soft: #5A2E41; --b-ink: #FFA9BF;
    --sun: #FFD84D; --egg: #FFF6D6; --danger: #FF8A80; --shadow: rgba(0,0,0,.4);
    --title-edge: #0E1828; --hill: #5E9E3A; --hill2: #4A8530; --cloud: #C9D6EA; --scene-sky: #2D4466;
    color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-game="uno"], :root:not([data-theme="light"])[data-pal="2"] {
    --a: #7CBFF5; --a-soft: #1F3F66; --a-ink: #8EC8F8;
    --b: #FF9A9A; --b-soft: #5A2A2D; --b-ink: #FFA3A3;
  }
  :root:not([data-theme="light"])[data-pal="3"] {
    --a: #FFC074; --a-soft: #5A3A18; --a-ink: #FFCB8C;
    --b: #C7B0FF; --b-soft: #3F3466; --b-ink: #D2BFFF;
  }
  :root:not([data-theme="light"])[data-pal="4"] {
    --a: #6FE0D4; --a-soft: #1D4A46; --a-ink: #8CE9DF;
    --b: #FFD84D; --b-soft: #54481A; --b-ink: #FFE57A;
  }
}
:root[data-theme="dark"] {
  --bg: #1C2A40; --dot: rgba(255,255,255,.07);
  --surface: #2B3C57; --surface2: #364C6E; --fg: #F6EBCB; --muted: #BAC6D9; --line: #4A6286;
  --a: #9AD95A; --a-soft: #2D4A2B; --a-ink: #A8E070;
  --b: #FF9DB5; --b-soft: #5A2E41; --b-ink: #FFA9BF;
  --sun: #FFD84D; --egg: #FFF6D6; --danger: #FF8A80; --shadow: rgba(0,0,0,.4);
  --title-edge: #0E1828; --hill: #5E9E3A; --hill2: #4A8530; --cloud: #C9D6EA; --scene-sky: #2D4466;
  color-scheme: dark;
}
:root[data-theme="dark"][data-game="uno"], :root[data-theme="dark"][data-pal="2"] {
  --a: #7CBFF5; --a-soft: #1F3F66; --a-ink: #8EC8F8;
  --b: #FF9A9A; --b-soft: #5A2A2D; --b-ink: #FFA3A3;
}
:root[data-theme="dark"][data-pal="3"] {
  --a: #FFC074; --a-soft: #5A3A18; --a-ink: #FFCB8C;
  --b: #C7B0FF; --b-soft: #3F3466; --b-ink: #D2BFFF;
}
:root[data-theme="dark"][data-pal="4"] {
  --a: #6FE0D4; --a-soft: #1D4A46; --a-ink: #8CE9DF;
  --b: #FFD84D; --b-soft: #54481A; --b-ink: #FFE57A;
}
* { box-sizing: border-box; }
body {
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--dot) 3px, transparent 3.5px);
  background-size: 34px 34px;
  color: var(--fg);
  font: 500 16px/1.45 var(--font-body);
  padding-block: 10px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  height: 100%; overflow: hidden;
}
html { height: 100%; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; }
h1 {
  font: 400 clamp(23px, 7.2vw, 32px)/1.05 var(--font-display); margin: 0; letter-spacing: .01em; color: var(--title-fill);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
  text-shadow: 2px 0 var(--title-edge), -2px 0 var(--title-edge), 0 2px var(--title-edge), 0 -2px var(--title-edge),
    1.5px 1.5px var(--title-edge), -1.5px 1.5px var(--title-edge), 1.5px -1.5px var(--title-edge), -1.5px -1.5px var(--title-edge),
    0 5px 0 var(--title-edge);
  padding: 2px 4px 7px 2px; min-width: 0;
}
h2 { font: 400 22px/1.2 var(--font-display); margin: 0; text-wrap: balance; }
.pa { --pc: var(--a); --pc-soft: var(--a-soft); --pc-ink: var(--a-ink); }
.pb { --pc: var(--b); --pc-soft: var(--b-soft); --pc-ink: var(--b-ink); }
.muted { color: var(--muted); }
.small { font-size: 13.5px; }
.l { display: block; font-size: 13.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--pc); border: 2px solid var(--fg); margin-right: 6px; vertical-align: -1px; }

button { font-family: inherit; }
.btn {
  min-height: 46px; padding: 0 18px; border-radius: var(--wob); border: 3px solid var(--fg);
  background: var(--surface); color: var(--fg); font: 600 15px var(--font-body); cursor: pointer;
  box-shadow: 0 4px 0 var(--shadow);
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.btn.go { background: var(--sun); color: var(--on-pc); }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }

.head { display: flex; align-items: center; gap: 8px; flex: none; }
.fan { display: flex; flex: none; padding: 4px 4px 0 10px; }
.iconbtn {
  flex: none; width: 42px; height: 42px; border-radius: var(--wob); border: 3px solid var(--fg); background: var(--surface); color: var(--fg);
  font: 700 21px/1 var(--font-sym); cursor: pointer; box-shadow: 0 3px 0 var(--shadow); display: flex; align-items: center; justify-content: center; padding: 0;
}
.iconbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
.fan i {
  width: 26px; height: 36px; border-radius: 7px; margin-left: -9px; display: flex; align-items: center; justify-content: center;
  font: 700 17px var(--font-sym); font-style: normal; border: 2.5px solid var(--fg); transform-origin: 50% 100%; color: var(--on-pc);
}
.fan i:nth-child(1) { transform: rotate(-13deg); }
.fan i:nth-child(2) { transform: rotate(-4deg); }
.fan i:nth-child(3) { transform: rotate(5deg); }
.fan i:nth-child(4) { transform: rotate(14deg); }
.fan i.w { background: var(--egg); }
.fan i.w.r { color: #C0394D; }
.fan i.blue { background: var(--c-blue); }
.fan i.red { background: var(--c-red); }
.fan i.yellow { background: var(--c-yellow); }
.fan i.green { background: var(--c-green); }
.fan i.ca { background: var(--a); }
.fan i.cb { background: var(--b); }

.scene { border: 3px solid var(--fg); border-radius: var(--wob); overflow: hidden; background: var(--scene-sky); height: 52px; flex: none; box-shadow: 0 4px 0 var(--shadow); }
.scene svg { width: 100%; height: 100%; display: block; }
.s-cloud { fill: var(--cloud); }
.s-hill { fill: var(--hill); stroke: var(--fg); stroke-width: 2.5; }
.s-hill2 { fill: var(--hill2); stroke: var(--fg); stroke-width: 2.5; }
.s-sun { fill: var(--sun); stroke: var(--fg); stroke-width: 2.5; }
.s-petal { fill: var(--b); stroke: var(--fg); stroke-width: 1.5; }
.s-petal2 { fill: var(--egg); stroke: var(--fg); stroke-width: 1.5; }
.s-core { fill: var(--sun); stroke: var(--fg); stroke-width: 1.5; }
.s-stem { stroke: var(--fg); stroke-width: 2.5; fill: none; stroke-linecap: round; }

.games { display: flex; gap: 6px; flex: none; overflow-x: auto; padding: 2px 2px 6px; scrollbar-width: none; }
.games::-webkit-scrollbar { display: none; }
.games button {
  flex: 1 0 78px; min-height: 44px; min-width: 0; padding: 0 8px; border-radius: var(--wob); border: 3px solid var(--fg); background: var(--surface2); color: var(--fg);
  font: 400 16px var(--font-display); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 3px 0 var(--shadow);
}
.games button[aria-pressed="true"] { background: var(--sun); color: var(--on-pc); transform: translateY(2px); box-shadow: 0 2px 0 var(--shadow); }
.games button.add { border-style: dashed; background: transparent; box-shadow: none; }
.games button.add[aria-pressed="true"] { border-style: solid; background: var(--sun); box-shadow: 0 2px 0 var(--shadow); }
.gt { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gl { flex: none; }
.gl.suits { font: 700 16px var(--font-sym); letter-spacing: 1px; }
.gl.blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; width: 18px; height: 18px; }
.gl.blocks i { border-radius: 3px; display: block; border: 1.5px solid var(--fg); }
.gl.blocks i:nth-child(1) { background: var(--c-red); }
.gl.blocks i:nth-child(2) { background: var(--c-yellow); }
.gl.blocks i:nth-child(3) { background: var(--c-blue); }
.gl.blocks i:nth-child(4) { background: var(--c-green); }
.gl.sum { font: 400 22px/1 var(--font-display); }

.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface2); padding: 4px; border-radius: var(--wob); border: 3px solid var(--fg); flex: none; }
.tabs button { min-height: 36px; min-width: 0; padding: 0 2px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 600 13.5px var(--font-body); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 0 0 2.5px var(--fg); }

.period { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; flex: none; }
.period .l { margin: 0; }
.period .chip { min-height: 34px; padding: 0 12px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  min-height: 40px; padding: 0 14px; border-radius: 999px; border: 2.5px solid var(--fg); background: var(--surface); color: var(--fg);
  font: 600 14px var(--font-body); cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--sun); color: var(--on-pc); }
.chip .sym { font: 700 16px var(--font-sym); }
.chip.pal i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--fg); display: inline-block; }

section { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
#main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#main > section { flex: 1; min-height: 0; gap: 10px; }
#main > section.scroll { overflow-y: auto; overscroll-behavior: contain; padding: 2px 2px 10px; gap: 14px; }
#main > section.scroll > * { flex: none; }

#board { --egg-h: clamp(80px, 18vh, 160px); flex: 1; min-height: 0; max-height: 540px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 14px; }
.player { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
.face {
  position: relative; border-radius: var(--wob); padding: 10px 8px 6px; min-width: 0; flex: 1; min-height: 0; justify-content: center;
  display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center;
  background: var(--surface); border: 3px solid var(--fg); color: var(--fg); box-shadow: 0 5px 0 var(--shadow);
}
.player.lead .face::after {
  content: "★"; position: absolute; top: -19px; left: 50%; transform: translateX(-50%); font: 28px/1 var(--font-sym); color: var(--sun);
  text-shadow: 2px 0 var(--fg), -2px 0 var(--fg), 0 2px var(--fg), 0 -2px var(--fg), 1.5px 1.5px var(--fg), -1.5px -1.5px var(--fg), 1.5px -1.5px var(--fg), -1.5px 1.5px var(--fg);
}
.idx { position: absolute; font: 700 17px/1 var(--font-sym); color: var(--pc-ink); }
.idx.tl { top: 9px; left: 10px; }
.idx.br { bottom: 9px; right: 10px; transform: rotate(180deg); }
.pname { font: 400 22px/1.1 var(--font-display); max-width: 100%; padding-inline: 22px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.egg {
  width: calc(var(--egg-h) * .84); height: var(--egg-h); flex: none; margin: 2px 0; border: 3px solid var(--fg); border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 24% 27%, var(--pc) 0 8%, transparent 8.6%),
    radial-gradient(circle at 80% 22%, var(--pc) 0 6.5%, transparent 7.1%),
    radial-gradient(circle at 83% 74%, var(--pc) 0 9%, transparent 9.6%),
    radial-gradient(circle at 19% 76%, var(--pc) 0 6%, transparent 6.6%),
    var(--egg);
}
.total { font: 400 calc(var(--egg-h) * .5)/1 var(--font-display); font-variant-numeric: tabular-nums; color: var(--on-pc); margin-top: 6px; }
.total.t3 { font-size: calc(var(--egg-h) * .35); }
.sub { font-size: 13px; color: var(--muted); padding-inline: 8px; padding-bottom: 12px; min-height: 34px; display: flex; align-items: center; justify-content: center; line-height: 1.25; }
.win-btn {
  min-height: 52px; flex: none; border-radius: var(--wob); border: 3px solid var(--fg); background: var(--pc); color: var(--on-pc);
  font: 400 18px/1.1 var(--font-display); cursor: pointer; box-shadow: 0 5px 0 var(--fg); padding: 4px 8px;
}
.win-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--fg); }

:root[data-game="uno"] .face { background: var(--pc); color: var(--on-pc); }
:root[data-game="uno"] .idx { color: var(--on-pc); }
:root[data-game="uno"] .sub { color: var(--on-pc); }

.last { margin: 0; text-align: center; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.actions .btn { flex: 1 1 140px; }
.card { background: var(--surface); border: 3px solid var(--fg); border-radius: var(--wob); padding: 14px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: 0 4px 0 var(--shadow); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
input[type="text"], textarea {
  width: 100%; min-width: 0; min-height: 48px; border-radius: 12px; border: 2.5px solid var(--fg);
  background: var(--bg); color: var(--fg); font: 500 16px var(--font-body); padding: 0 12px;
}
textarea { min-height: 90px; padding: 10px 12px; font-size: 13px; resize: vertical; }

details { background: var(--surface); border: 3px solid var(--fg); border-radius: var(--wob); padding: 0 14px; box-shadow: 0 4px 0 var(--shadow); }
summary { min-height: 50px; display: flex; align-items: center; font: 400 19px var(--font-display); cursor: pointer; }
details[open] summary { border-bottom: 2.5px dashed var(--line); margin-bottom: 14px; }
details .body { display: flex; flex-direction: column; gap: 12px; padding-bottom: 14px; }

.tablebox { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 8px; text-align: center; border-bottom: 2.5px dashed var(--line); }
thead th { font-size: 14px; font-weight: 600; }
.stat tbody th { text-align: left; color: var(--muted); font-weight: 500; }
.stat td { font: 600 16px var(--font-body); }
.stat td.best { font: 400 20px var(--font-display); }
tr:last-child th, tr:last-child td { border-bottom: 0; }
.split { display: flex; height: 16px; border-radius: 99px; overflow: hidden; background: var(--surface2); border: 2.5px solid var(--fg); }
.split span { display: block; height: 100%; }
.split .sa { background: var(--a); }
.split .sb { background: var(--b); }
.score-line { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; }
.score-line .big { font: 400 46px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.score-line .who { font: 400 20px var(--font-display); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.score-line .who:last-child { text-align: right; }
.form { display: flex; gap: 6px; flex-wrap: wrap; }
.mc {
  display: inline-flex; align-items: center; justify-content: center; flex: none; width: 26px; height: 36px; border-radius: 7px;
  font: 700 13px var(--font-sym); font-style: normal; background: var(--pc); color: var(--on-pc); border: 2.5px solid var(--fg);
}
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
svg { display: block; width: 100%; height: auto; }
.ax { font: 11px var(--font-body); fill: var(--muted); }
.grid { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 4 4; }
.fact { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 2.5px dashed var(--line); }
.fact:last-child { border-bottom: 0; }
.fact b { font: 400 18px var(--font-display); font-variant-numeric: tabular-nums; text-align: right; }
.fact .gname { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }

ul.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.hrow { background: var(--surface); border: 3px solid var(--fg); border-radius: var(--wob); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 0 4px 0 var(--shadow); }
.hrow .left { display: flex; align-items: center; gap: 12px; min-width: 0; }
.hrow .win { font: 400 20px var(--font-display); }
.hrow .left > div { min-width: 0; }
.empty { margin: 0; color: var(--muted); }

.grass { height: 14px; flex: none; background: radial-gradient(circle at 50% 100%, var(--hill) 0 7px, transparent 7.6px) 0 0 / 14px 14px repeat-x; }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: var(--wob); font-weight: 600; font-size: 14.5px;
  max-width: calc(100% - 32px); z-index: 40; text-align: center;
}

/* Imagem para compartilhar */
.sheet {
  position: fixed; inset: 0; z-index: 35; background: rgba(20,14,8,.6); overflow-y: auto;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet-in { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; background: var(--surface); border: 3px solid var(--fg); border-radius: var(--wob); padding: 14px; }
.sheet-in img { width: 100%; height: auto; border: 3px solid var(--fg); border-radius: 12px; display: block; background: var(--bg); }

.sheet-in .body { display: flex; flex-direction: column; gap: 12px; }
.row-last { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex: none; }
.row-last .last { text-align: left; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }

/* Loja */
.shop { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.shop .chips { gap: 6px; flex-wrap: nowrap; }
.shop .chip { min-height: 36px; padding: 0 12px; font-size: 13px; min-width: 0; white-space: nowrap; }
.shop .chips .chip { flex: 1; justify-content: center; }
.shopinfo { margin: 0; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tile { --pc: var(--a); background: var(--surface); border: 3px solid var(--fg); border-radius: var(--wob); padding: 6px; display: flex; flex-direction: column; gap: 5px; min-width: 0; box-shadow: 0 3px 0 var(--shadow); }
.tile.on { background: var(--sun); color: var(--on-pc); }
.prev { height: clamp(52px, 9vh, 84px); border: 2.5px solid var(--fg); border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--surface2); padding: 0; cursor: pointer; color: var(--fg); }
div.prev { cursor: default; }
.fxg { font: 700 30px/1 var(--font-sym); text-shadow: 2px 0 var(--fg), -2px 0 var(--fg), 0 2px var(--fg), 0 -2px var(--fg), 1.5px 1.5px var(--fg), -1.5px -1.5px var(--fg), 1.5px -1.5px var(--fg), -1.5px 1.5px var(--fg); }
.tname { font: 400 14px/1.1 var(--font-display); text-align: center; min-height: 2.2em; display: flex; align-items: center; justify-content: center; }
.tbtn { min-height: 34px; padding: 0 4px; font-size: 12.5px; box-shadow: 0 3px 0 var(--shadow); flex: none; }
.tbtn.nope { opacity: .6; }
.tbtn[disabled] { box-shadow: none; background: transparent; border-style: dashed; color: inherit; cursor: default; }
.egm { width: 26px; height: 32px; border: 2.5px solid var(--fg); border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; display: block;
  background: radial-gradient(circle at 30% 30%, var(--pc) 0 12%, transparent 13%), radial-gradient(circle at 72% 68%, var(--pc) 0 14%, transparent 15%), var(--egg); }

/* Fundos do contador (comprados na loja) */
:root .face[data-bg], :root .bgprev[data-bg] { color: #3A2814; }
:root .face[data-bg] .sub, :root .face[data-bg] .idx { color: #3A2814; }
:root .face[data-bg="bolinhas"], :root .bgprev[data-bg="bolinhas"] { background: radial-gradient(circle, #FFB3C6 0 4.5px, transparent 5px) 0 0 / 22px 22px, #FFF1B8; }
:root .face[data-bg="grama"], :root .bgprev[data-bg="grama"] { background: repeating-linear-gradient(90deg, #B7E37A 0 16px, #A6D966 16px 32px); }
:root .face[data-bg="nuvens"], :root .bgprev[data-bg="nuvens"] {
  background: radial-gradient(circle at 22% 22%, #fff 0 13px, transparent 14px), radial-gradient(circle at 34% 18%, #fff 0 17px, transparent 18px),
    radial-gradient(circle at 46% 24%, #fff 0 12px, transparent 13px), radial-gradient(circle at 70% 82%, #fff 0 12px, transparent 13px),
    radial-gradient(circle at 80% 78%, #fff 0 16px, transparent 17px), #BFE7F7;
}
:root .face[data-bg="porsol"], :root .bgprev[data-bg="porsol"] { background: linear-gradient(180deg, #FFD27A 0%, #FF9DB5 58%, #B79CFF 100%); }
:root .face[data-bg="noite"], :root .bgprev[data-bg="noite"] {
  background: radial-gradient(circle at 16% 14%, #FFF6D6 0 2px, transparent 2.6px), radial-gradient(circle at 78% 12%, #FFF6D6 0 2.5px, transparent 3.1px),
    radial-gradient(circle at 44% 30%, #FFF6D6 0 1.6px, transparent 2.2px), radial-gradient(circle at 90% 48%, #FFF6D6 0 1.8px, transparent 2.4px),
    radial-gradient(circle at 10% 62%, #FFF6D6 0 2px, transparent 2.6px), radial-gradient(circle at 60% 74%, #FFF6D6 0 1.6px, transparent 2.2px),
    radial-gradient(circle at 30% 90%, #FFF6D6 0 2px, transparent 2.6px), #1F2C4D;
}
:root .face[data-bg="noite"], :root .face[data-bg="noite"] .sub, :root .face[data-bg="noite"] .idx { color: #FFF6D6; }

/* Comemoração em poucos quadros, como giz de cera animado */
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; overflow: hidden; }
.cf { position: absolute; width: 0; height: 0; animation: fly 1.05s steps(3) both; }
.cf b {
  position: absolute; left: -13px; top: -13px; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
  font: 400 26px/1 var(--font-sym); animation: wig .4s steps(1) infinite;
}
.cf .p-star, .cf .p-flower, .cf .p-heart, .cf .p-spark {
  text-shadow: 2px 0 var(--fg), -2px 0 var(--fg), 0 2px var(--fg), 0 -2px var(--fg), 1.5px 1.5px var(--fg), -1.5px -1.5px var(--fg), 1.5px -1.5px var(--fg), -1.5px 1.5px var(--fg);
}
.cf .p-egg {
  left: -9px; top: -11px; width: 18px; height: 22px; border: 2.5px solid var(--fg); border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
  background: radial-gradient(circle at 35% 38%, var(--spot, #8FD14F) 0 24%, transparent 26%), var(--egg);
}
.cf .p-dot { left: -7px; top: -7px; width: 14px; height: 14px; border: 2.5px solid var(--fg); border-radius: 50%; }
.plus {
  position: absolute; transform: translateX(-50%); font: 400 48px/1 var(--font-display); color: var(--sun);
  text-shadow: 3px 0 var(--fg), -3px 0 var(--fg), 0 3px var(--fg), 0 -3px var(--fg), 2px 2px var(--fg), -2px -2px var(--fg), 2px -2px var(--fg), -2px 2px var(--fg);
  animation: rise 1s steps(1) both;
}
.bn {
  position: absolute; left: 50%; top: 36%; transform: translate(-50%, -50%); background: var(--sun); color: var(--on-pc);
  border: 4px solid var(--fg); border-radius: var(--wob); padding: 12px 24px 10px; text-align: center; box-shadow: 0 6px 0 var(--shadow);
  font: 400 28px/1.1 var(--font-display); white-space: nowrap; max-width: 92vw; animation: pop 1.7s steps(1) both;
}
.bn small { display: block; font: 600 16px var(--font-body); }
.egg.hop { animation: hop .7s steps(1) both; }
@keyframes fly {
  0% { transform: translate(0, 0) scale(.4); opacity: 1; }
  35% { transform: translate(calc(var(--dx) * .7), calc(var(--dy) * .9)) scale(1.1); }
  70% { transform: translate(var(--dx), calc(var(--dy) + 40px)) scale(1); }
  100% { transform: translate(calc(var(--dx) * 1.05), calc(var(--dy) + 120px)) scale(.9); opacity: 0; }
}
.cf.up { animation: flyup 1.2s steps(3) both; }
.cf.rain { animation: rain 1.4s steps(5) both; }
@keyframes flyup {
  0% { transform: translate(0, 0) scale(.4); opacity: 1; }
  35% { transform: translate(calc(var(--dx) * .5), calc(var(--dy) * .4)) scale(1.1); }
  70% { transform: translate(var(--dx), calc(var(--dy) * .8)) scale(1); }
  100% { transform: translate(calc(var(--dx) * 1.1), var(--dy)) scale(.9); opacity: 0; }
}
@keyframes rain { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: .25; } }
@keyframes wig { 0% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }
@keyframes hop {
  0% { transform: translateY(0); } 20% { transform: translateY(-16px) rotate(-5deg); } 40% { transform: translateY(0) rotate(3deg); }
  60% { transform: translateY(-8px) rotate(-3deg); } 80% { transform: translateY(0) rotate(2deg); } 100% { transform: none; }
}
@keyframes rise {
  0% { transform: translate(-50%, 0) scale(.6) rotate(-6deg); opacity: 1; } 20% { transform: translate(-50%, -14px) scale(1.2) rotate(4deg); }
  40% { transform: translate(-50%, -28px) scale(1) rotate(-3deg); } 70% { transform: translate(-50%, -40px) scale(1) rotate(3deg); }
  90% { transform: translate(-50%, -50px) scale(1) rotate(-2deg); opacity: .6; } 100% { transform: translate(-50%, -52px); opacity: 0; }
}
@keyframes pop {
  0% { transform: translate(-50%, -50%) scale(.3) rotate(-10deg); opacity: 0; } 12% { transform: translate(-50%, -50%) scale(1.25) rotate(4deg); opacity: 1; }
  24% { transform: translate(-50%, -50%) scale(.95) rotate(-4deg); } 36% { transform: translate(-50%, -50%) scale(1.08) rotate(3deg); }
  50% { transform: translate(-50%, -50%) scale(1) rotate(-3deg); } 70% { transform: translate(-50%, -50%) scale(1.04) rotate(2deg); }
  88% { transform: translate(-50%, -50%) scale(1) rotate(-2deg); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(.9) rotate(-2deg); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } #fx { display: none; } .egg.hop { animation: none; } }
@media (max-width: 380px) { .games button { font-size: 15px; gap: 4px; } .tabs button { font-size: 12.5px; } .bn { font-size: 24px; padding-inline: 14px; } }
@media (max-height: 760px) { .scene { display: none; } }
@media (max-height: 700px) {
  .shopinfo .hint { display: none; }
  .shop { gap: 6px; }
  .shop .chip { min-height: 32px; }
  .tiles { gap: 6px; }
  .tile { padding: 5px; gap: 4px; }
  .prev { height: 44px; }
  .tname { font-size: 13px; min-height: 2em; }
  .tbtn { min-height: 30px; font-size: 12px; }
  .novo-help { display: none; }
  .novo { gap: 8px; padding: 10px; }
  .novo .chip { min-height: 34px; padding: 0 11px; }
  .novo .l { margin-bottom: 4px; }
  .novo input[type="text"] { min-height: 42px; }
  .novo .btn { min-height: 42px; }
}
@media (max-height: 620px) {
  .prev { height: 36px; }
  .egm { width: 20px; height: 25px; }
  .tname { min-height: 1.1em; font-size: 12px; }
  .tile { padding: 4px; }
  .shopinfo { display: none; }
}
</style>

<body>

<script>
(function () {
  var KEY = 'pife-placar-v1';
  var $ = function (id) { return document.getElementById(id); };
  var PAL = [{ a: '#8FD14F', b: '#FF9DB5' }, { a: '#6EB6F2', b: '#FF8F8F' }, { a: '#FFB35C', b: '#B79CFF' }, { a: '#5FD6C9', b: '#FFE066' }];
  var PALINK = [['#3F7A1E', '#C23A5E'], ['#1F5FA8', '#C23A3A'], ['#A8560A', '#6B45C9'], ['#12766C', '#8A6A00']];
  var PALNAME = ['verde e rosa', 'azul e vermelho', 'laranja e lilás', 'turquesa e amarelo'];
  var BUILTIN = [

  ];
  var SYMS = [['♠', '♥'], ['♣', '♦'], ['♔', '♚'], ['⚀', '⚅'], ['●', '○'], ['★', '☆'], ['♪', '♫'], ['✿', '❀']];
  var PRESETS = [

  ];
  var MAX_EXTRA = 4;
  // Loja: cada vitória vale 1 de saldo para quem ganhou. Preços em vitórias.
  var BGS = [
    { id: 'padrao', name: 'Papel', price: 0 }, { id: 'bolinhas', name: 'Bolinhas', price: 10 }, { id: 'grama', name: 'Gramado', price: 20 },
    { id: 'nuvens', name: 'Nuvens', price: 30 }, { id: 'porsol', name: 'Pôr do sol', price: 40 }, { id: 'noite', name: 'Noite estrelada', price: 50 }
  ];
  var FXS = [
    { id: 'padrao', name: 'Estrelas e ovos', price: 0, glyph: '★', gc: '#FFE066' }, { id: 'ovos', name: 'Chuva de ovos', price: 10, glyph: '' },
    { id: 'flores', name: 'Jardim', price: 20, glyph: '✿', gc: '#FF9DB5' }, { id: 'coracoes', name: 'Corações', price: 30, glyph: '♥', gc: '#FF8F8F' },
    { id: 'estrelas', name: 'Estrelas cadentes', price: 40, glyph: '★', gc: '#FFE066' }, { id: 'fogos', name: 'Fogos de giz', price: 50, glyph: '✦', gc: '#6EB6F2' }
  ];
  var FXCFG = {
    padrao: { n: 16, kinds: ['star', 'egg', 'flower', 'dot'], d: [70, 160], mode: 'burst' },
    ovos: { n: 14, kinds: ['egg'], d: [60, 150], mode: 'burst', rainbow: true },

  };
  var RAINBOW = ['#FF8F8F', '#FFE066', '#6EB6F2', '#8FD14F', '#FF9DB5', '#B79CFF'];
  var shopP = 0, shopT = 'bg', armedBuy = null, buyTimer = null;
  function defShop() { return { own: { bg: ['padrao'], fx: ['padrao'] }, on: { bg: 'padrao', fx: 'padrao' }, spent: 0 }; }
  function cleanShop(s) {
    var o = defShop();
    if (!s || typeof s !== 'object') return o;
    var bgIds = BGS.map(function (x) { return x.id; }), fxIds = FXS.map(function (x) { return x.id; });
    if (s.own && Array.isArray(s.own.bg)) s.own.bg.forEach(function (id) { if (bgIds.indexOf(id) > -1 && o.own.bg.indexOf(id) < 0) o.own.bg.push(id); });

    if (s.on) {
      if (o.own.bg.indexOf(s.on.bg) > -1) o.on.bg = s.on.bg;

    return o;
  }
  var PERIODS = { tudo: 'Todas as partidas', mes: 'Este mês', '7d': 'Últimos 7 dias' };
  var tab = 'jogo';
  var adding = false;
  var draft = { name: '', sym: 0, pal: 1 };
  var armedDel = null, armTimer = null, resetTimer = null, delTimer = null, fxTimer = null;
  var shareBlob = null, shareName = '', shareUrl = null;

  /* ---------- Dados ---------- */
  function cleanGames(arr) {
    if (!Array.isArray(arr)) return [];
    return arr.filter(function (g) { return g && (g.winner === 0 || g.winner === 1); })
      .map(function (g, i) { return { id: g.id || (Date.now() + i), date: g.date || new Date().toISOString(), winner: g.winner }; });

  /* ---------- Utilidades ---------- */

  function compute(arr) {

      run[1 - w] = 0;
      if (wins[0] - wins[1] > lead[0]) lead[0] = wins[0] - wins[1];

  /* ---------- Estatísticas ---------- */
  function chartSvg(arr) {
    var games = arr, n = games.length, W = 320, H = 150, pl = 26, pr = 12, pt = 10, pb = 24;
    var ca = [0], cb = [0];
    games.forEach(function (g, i) { ca.push(ca[i] + (g.winner === 0 ? 1 : 0)); cb.push(cb[i] + (g.winner === 1 ? 1 : 0)); });
    var maxY = Math.max(1, ca[n], cb[n]);
    function X(i) { return pl + (W - pl - pr) * (i / n); }
    function Y(v) { return pt + (H - pt - pb) * (1 - v / maxY); }
    var ticks = [0];
    if (maxY >= 4) ticks.push(Math.round(maxY / 2));
    ticks.push(maxY);
    var grid = ticks.map(function (v) {
      return '<line class="grid" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/><text class="ax" x="' + (pl - 6) + '" y="' + (Y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    }).join('');
    function line(arr2, color) {
      var pts = arr2.map(function (v, i) { return X(i).toFixed(1) + ',' + Y(v).toFixed(1); }).join(' ');
      return '<polyline points="' + pts + '" fill="none" stroke="var(' + color + ')" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>' +
        '<circle cx="' + X(n).toFixed(1) + '" cy="' + Y(arr2[n]).toFixed(1) + '" r="5" fill="var(' + color + ')" stroke="var(--fg)" stroke-width="2"/>';
    }
    var xl = '<text class="ax" x="' + pl + '" y="' + (H - 6) + '" text-anchor="start">início</text><text class="ax" x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end">' + n + ' partidas</text>';
    var label = 'Vitórias acumuladas: ' + nm(0) + ' ' + ca[n] + ', ' + nm(1) + ' ' + cb[n];
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(label) + '">' + grid + xl + line(ca, '--a-ink') + line(cb, '--b-ink') + '</svg>';
  }
  function head() {

  function playFx(fxId, rect, w, streak, showPlus) {

    function pick(k) { return cfg.rainbow ? RAINBOW[k % RAINBOW.length] : col; }
    for (var k = 0; k < cfg.n; k++) {
      var el = document.createElement('div');
      el.className = 'cf' + (cfg.mode === 'up' ? ' up' : cfg.mode === 'rain' ? ' rain' : '');

      if (it.price > bal) { toast('Faltam ' + (it.price - bal) + ' vitórias para ' + nm(shopP) + ' comprar ' + it.name + '.'); return; }
      if (armedBuy !== key) {
        armedBuy = key; renderLoja();
        clearTimeout(buyTimer); buyTimer = setTimeout(function () { armedBuy = null; renderLoja(); }, 3000);
        return;
      }
      clearTimeout(buyTimer); armedBuy = null;
      sh.spent += it.price; sh.own[shopT].push(id); sh.on[shopT] = id;
      save(); renderAll(); toast(nm(shopP) + ' comprou ' + it.name + '.');
    }
  });

  // Novo jogo
  $('tab-novo').addEventListener('input', function (e) {
    if (e.target.id === 'gname') draft.name = e.target.value;
  });
  $('tab-novo').addEventListener('click', function (e) {
    var p = e.target.closest('button[data-preset]');
    if (p) { var pr = PRESETS[Number(p.getAttribute('data-preset'))]; draft = { name: pr.name, sym: pr.sym, pal: pr.pal }; renderNovo(); return; }
    var s = e.target.closest('button[data-sym]');
    if (s) { draft.sym = Number(s.getAttribute('data-sym')); renderNovo(); return; }
    var c = e.target.closest('button[data-pal]');
    if (c) { draft.pal = Number(c.getAttribute('data-pal')); renderNovo(); return; }
    if (e.target.closest('#gcancel')) { adding = false; renderAll(); return; }
    if (e.target.closest('#gcreate')) {
      var name = draft.name.trim();
      if (!name) { toast('Dê um nome ao jogo.'); return; }
      var low = name.toLowerCase();
      if (['pife', 'uno', 'geral'].indexOf(low) > -1 || state.extra.some(function (x) { return x.name.toLowerCase() === low; })) { toast('Já existe um jogo com esse nome.'); return; }
      if (state.extra.length >= MAX_EXTRA) { toast('Limite de ' + MAX_EXTRA + ' jogos novos.'); return; }
      var id = 'g' + Date.now().toString(36);
      state.extra.push({ id: id, name: name.slice(0, 16), sym: SYMS[draft.sym].slice(), pal: draft.pal, games: [] });
      state.game = id; adding = false; tab = 'jogo'; save(); renderAll();
      toast('Jogo ' + name + ' criado.');
    }
  });

  $('nameA').addEventListener('input', function () { state.names[0] = this.value.trim() || 'Paulo'; save(); renderAll(); });
  $('nameB').addEventListener('input', function () { state.names[1] = this.value.trim() || 'Manu'; save(); renderAll(); });

  $('copyData').addEventListener('click', function () {
    var ta = $('backup');
    ta.value = JSON.stringify(state);
    function fallback() { ta.focus(); ta.select(); toast('Selecionado. Copie o texto manualmente.'); }
    try {
      navigator.clipboard.writeText(ta.value).then(function () { toast('Dados copiados.'); }, fallback);
    } catch (err) { fallback(); }
  });
  $('restoreData').addEventListener('click', function () {
    var raw = $('backup').value.trim();
    if (!raw) { toast('Cole o backup no campo primeiro.'); return; }
    try {
      var obj = JSON.parse(raw);
      if (!obj || !(Array.isArray(obj.games) || Array.isArray(obj.pife) || Array.isArray(obj.uno) || Array.isArray(obj.extra))) throw new Error('formato');
      state = normalize(obj); save(); adding = false;
      $('nameA').value = state.names[0]; $('nameB').value = state.names[1];
      renderAll(); toast('Dados restaurados.');
    } catch (err) { toast('Backup inválido. Confira o texto colado.'); }
  });

  $('resetAll').addEventListener('click', function () {
    var b = $('resetAll');
    if (cur() === 'geral') { toast('Escolha um jogo para zerar.'); return; }
    if (b.getAttribute('data-armed')) {
      clearTimeout(resetTimer); b.removeAttribute('data-armed');
      list().length = 0; save(); renderAll(); toast('Placar de ' + gm(cur()).label + ' zerado.');
    } else {
      b.setAttribute('data-armed', '1'); b.textContent = 'Toque de novo para confirmar';
      resetTimer = setTimeout(function () { b.removeAttribute('data-armed'); renderHead(); }, 3000);
    }
  });
  $('delGame').addEventListener('click', function () {
    var b = $('delGame'), meta = gm(cur());
    if (!meta.custom) return;
    if (b.getAttribute('data-armed')) {
      clearTimeout(delTimer); b.removeAttribute('data-armed'); b.textContent = 'Excluir este jogo';
      state.extra = state.extra.filter(function (x) { return x.id !== meta.id; });
      state.game = 'pife'; save(); renderAll(); toast('Jogo ' + meta.label + ' excluído.');
    } else {
      b.setAttribute('data-armed', '1'); b.textContent = 'Toque de novo para excluir o jogo e o histórico';
      delTimer = setTimeout(function () { b.removeAttribute('data-armed'); b.textContent = 'Excluir este jogo'; }, 3500);
    }
  });

  $('nameA').value = state.names[0]; $('nameB').value = state.names[1];
  save();
  renderAll();
})();
</script>

<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
